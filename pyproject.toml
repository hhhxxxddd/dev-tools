[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-dev-tools"
version = "0.1.0"
description = "Cross-platform mise workflows and project toolchain discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dev-tools-project = "dev_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

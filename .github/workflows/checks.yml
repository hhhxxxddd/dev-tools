name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.8'
      - name: Install verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Parse PowerShell entrypoints and installers
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Check Bash entrypoints and installers
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/dev-tools scripts/dev-info
          for file in scripts/*.sh; do bash -n "$file"; done
          shellcheck scripts/dev-tools scripts/dev-info scripts/*.sh
      - name: Unit and CLI contract tests
        run: python -m unittest discover -v tests
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Validate versions, documentation and TOML
        run: python -m dev_tools.validation
      - name: Build and verify the extracted package
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          args = [sys.executable, "-m", "dev_tools.release", "--output", "dist"]
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              args += ["--tag", os.environ["GITHUB_REF_NAME"], "--official"]
          subprocess.run(args, check=True)
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          subprocess.run([sys.executable, "-m", "dev_tools.package_smoke", f"dist/dev-tools-{version}.zip"], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dev-tools-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
